name: Update Japan rules

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update.yml"
      - "scripts/build_rules.py"
      - "manual/japan-content.list"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build consolidated Mihomo domain list
        run: |
          set -euo pipefail
          python3 scripts/build_rules.py

      - name: Validate generated rules
        run: |
          set -euo pipefail

          test -s rules/japan-only.list
          grep -Fxq '+.dmm.com' rules/japan-only.list
          grep -Fxq '+.dmm.co.jp' rules/japan-only.list
          grep -Fxq '+.fanza.jp' rules/japan-only.list
          grep -Fxq '+.bookwalker.jp' rules/japan-only.list
          grep -Fxq '+.manga.line.me' rules/japan-only.list

          rule_count="$(grep -Ec '^\+?([A-Za-z0-9_-]+\.)+[A-Za-z]{2,}$' rules/japan-only.list || true)"
          echo "Generated rule count: $rule_count"

          if [ "$rule_count" -lt 25 ]; then
            echo "Generated rule set is suspiciously small; refusing to publish."
            exit 1
          fi

      - name: Commit changes if changed
        run: |
          set -euo pipefail

          if git diff --quiet -- rules/japan-only.list; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/japan-only.list
          git commit -m "chore: update Japan rules"
          git push
