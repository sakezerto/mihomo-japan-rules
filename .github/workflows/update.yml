name: Update Japan rules

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download upstream Japan rules
        run: |
          curl -fsSL \
            https://ruleset.skk.moe/Clash/non_ip/stream_jp.txt \
            -o /tmp/stream_jp.txt

      - name: Build consolidated Mihomo domain list
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# mihomo-japan-rules"
            echo "# Generated by GitHub Actions"
            echo "# Upstream: https://ruleset.skk.moe/Clash/non_ip/stream_jp.txt"
            echo

            awk -F',' '
              $1 == "DOMAIN-SUFFIX" { print "+." $2 }
              $1 == "DOMAIN"        { print $2 }
            ' /tmp/stream_jp.txt

            echo
            cat manual/japan-content.list
          } \
          | sed \
              -e 's/[[:space:]]*#.*$//' \
              -e '/^[[:space:]]*$/d' \
          | grep -E '^\+?([A-Za-z0-9_-]+\.)+[A-Za-z]{2,}$' \
          | sort -fu \
          > rules/japan-only.list

          # SukkaW includes an internal anti-cache/test domain in stream_jp.txt.
          sed -i '/ru1353t\.1s\.m4d3\.by\.5ukk4w\.skk\.moe/d' rules/japan-only.list

      - name: Commit changes if changed
        run: |
          if git diff --quiet -- rules/japan-only.list; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/japan-only.list
          git commit -m "chore: update Japan rules"
          git push
